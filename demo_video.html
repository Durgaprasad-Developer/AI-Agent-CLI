<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent CLI Demo</title>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #121212; color: white; display: flex; height: 100vh; overflow: hidden; }
        .terminal { width: 40%; background: #000; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 14px; overflow-y: auto; border-right: 2px solid #333; }
        .preview { width: 60%; background: #f0f0f0; position: relative; }
        .preview iframe { width: 100%; height: 100%; border: none; }
        .cursor { display: inline-block; width: 10px; height: 18px; background: #00ff00; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        .step-START { color: #00bcd4; font-weight: bold; }
        .step-THINK { color: #ff9800; }
        .step-TOOL { color: #4caf50; }
        .step-OBSERVE { color: #9c27b0; }
        .step-OUTPUT { color: #ffeb3b; font-weight: bold; }
        .line { margin-bottom: 10px; opacity: 0; transform: translateY(10px); animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="terminal" id="terminal">
        <div id="output"></div>
        <span class="cursor"></span>
    </div>
    <div class="preview">
        <iframe id="scaler-frame" src="scaler_clone/index.html"></iframe>
    </div>

    <script>
        const terminal = document.getElementById('output');
        const frame = document.getElementById('scaler-frame');
        
        const script = [
            { step: 'START', content: 'User requested to clone Scaler Academy website into "scaler_clone" folder.' },
            { step: 'THINK', content: 'I need to analyze the Scaler website structure. It has a Header, Hero section, and a Footer.' },
            { step: 'THINK', content: 'I will start by creating the directory and then write the HTML, CSS, and JS files.' },
            { step: 'TOOL', content: 'Calling writeFile("scaler_clone/index.html", ...)' },
            { step: 'OBSERVE', content: 'File written to scaler_clone/index.html' },
            { step: 'THINK', content: 'Now I will create the style.css file with premium Scaler branding.' },
            { step: 'TOOL', content: 'Calling writeFile("scaler_clone/style.css", ...)' },
            { step: 'OBSERVE', content: 'File written to scaler_clone/style.css' },
            { step: 'THINK', content: 'Adding script.js for interactivity.' },
            { step: 'TOOL', content: 'Calling writeFile("scaler_clone/script.js", ...)' },
            { step: 'OBSERVE', content: 'File written to scaler_clone/script.js' },
            { step: 'THINK', content: 'All files generated. Testing the clone visually.' },
            { step: 'OUTPUT', content: 'Successfully cloned Scaler Academy website into scaler_clone/. Open index.html to view.' }
        ];

        let index = 0;
        function addLine() {
            if (index < script.length) {
                const line = document.createElement('div');
                line.className = 'line';
                const s = script[index];
                line.innerHTML = `<span class="step-${s.step}">[${s.step}]</span> ${s.content}`;
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                index++;
                setTimeout(addLine, 1500);
            }
        }

        setTimeout(addLine, 1000);
    </script>
</body>
</html>
